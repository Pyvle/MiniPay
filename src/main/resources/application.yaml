spring:
  config:
    import: "optional:file:./.env[.properties]"
    
  application:
    name: minipay

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET lock_timeout = '3s'"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  auth:
    session-ttl: 7d
    access-token-ttl: 15m
    jwt-secret: ${JWT_SECRET}
